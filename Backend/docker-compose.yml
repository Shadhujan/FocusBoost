version: '3.8'

services:
  focusboost-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount models directory for ML models
      - ./models:/app/models
      # Mount logs directory if you want to persist logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - focusboost-network

  # Optional: Add a database service if needed in the future
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: focusboost
  #     POSTGRES_USER: focusboost_user
  #     POSTGRES_PASSWORD: focusboost_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - focusboost-network

networks:
  focusboost-network:
    driver: bridge

